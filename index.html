<style>
  :root {
    --ink:        #04122c;
    --ink-deep:   #030d20;
    --sea:        #0a2a63;
    --sea-lit:    #0f47a1;
    --gold:       #fab040;
    --white:      #ffffff;
    --mist:       rgba(255,255,255,.46);
    --mist-soft:  rgba(255,255,255,.28);
    --font:       'Poppins', Arial, Helvetica, sans-serif;
    --pad:        clamp(20px, 4vw, 44px);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    color: var(--white);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--sea) 0%, var(--ink) 55%, var(--ink-deep) 100%)
      no-repeat fixed;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
    border-radius: 4px;
  }

  /* ---------- shared chrome ---------- */

  .logo {
    position: fixed;
    top: var(--pad);
    left: var(--pad);
    width: 190px;
    height: auto;
    z-index: 20;
    transition: opacity .2s ease;
  }
  .logo.corner {
    left: auto;
    right: var(--pad);
    width: 150px;
    opacity: .45;
  }

  .control {
    position: fixed;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--mist);
    transition: color .18s ease;
  }
  .control:hover { color: var(--white); }
  .control .arrow {
    color: var(--mist-soft);
    transition: color .18s ease, transform .18s ease;
  }
  .control:hover .arrow { color: var(--gold); }
  .control.back:hover  .arrow { transform: translateX(-4px); }
  .control.prev:hover  .arrow { transform: translateX(-4px); }
  .control.next:hover  .arrow { transform: translateX(4px); }

  .control.back { top: calc(var(--pad) - 2px); left: var(--pad); }
  .control.prev { bottom: var(--pad); left: var(--pad); }
  .control.next { bottom: var(--pad); right: var(--pad); }
  .control[hidden] { display: none; }

  /* ---------- views ---------- */

  .view { display: none; }
  .view.on { display: block; animation: rise .26s ease both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- home ---------- */

  #home.on {
    display: flex;
    align-items: center;
    min-height: 100svh;
    padding: calc(var(--pad) + 62px) var(--pad) var(--pad);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.6vw, 22px);
    width: 100%;
    max-width: 1240px;
    max-width: min(1240px, calc((100svh - 210px) * 16 / 9 + 44px));
    margin: 0 auto;
  }

  .tile {
    display: block;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: var(--sea);
    box-shadow: 0 10px 30px rgba(2, 10, 28, .45);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .tile img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
  .tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 18px 42px rgba(15, 71, 161, .5);
  }
  .tile:hover::after, .tile:focus-visible::after { transform: scaleX(1); }

  /* ---------- session ---------- */

  #session.on {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100svh;
    padding: calc(var(--pad) + 56px) var(--pad);
  }

  .wrap {
    width: min(1180px, 100%);
    margin: 0 auto;
  }

  .head {
    width: 100%;
    margin: 0 0 clamp(18px, 2.4vh, 30px);
  }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .title {
    margin: 0;
    font-size: clamp(21px, 2.7vw, 33px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.15;
  }

  .stage {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 22px 60px rgba(2, 10, 28, .55);
  }
  .stage iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* Keep the whole session on one screen: the video never grows past the
     height left over after the title and the Previous/Next row. */
  @media (min-width: 780px) {
    .wrap { width: min(1180px, 100%, calc((100vh - 340px) * 16 / 9)); }
    .wrap { width: min(1180px, 100%, calc((100svh - 340px) * 16 / 9)); }
  }

  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 620px) {
    #session.on { justify-content: flex-start; padding-top: calc(var(--pad) + 52px); }
    .grid { grid-template-columns: 1fr; }
    .logo { width: 148px; }
    .logo.right { width: 118px; }
    .control { font-size: 10.5px; letter-spacing: .12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

  /* To add a session: add one line below and point `cover` at an image URL.
     The "of N" count and the Previous/Next order follow this list. */
  const SESSIONS = [
    { n: 1, title: "The Success Triangle", video: "ZnBYvA13MOM", cover: C1 },
    { n: 2, title: "The Buyer/Seller Dynamic", video: "_hVzOWNpyhA", cover: C2 },
    { n: 3, title: "Essential Communication Skills", video: "z2T15ySvl3I", cover: C3 },
    { n: 4, title: "Creating Mutual Agreement", video: "Y-XMllhRKOw", cover: C4 },
    { n: 5, title: "Discovering Buyers’ Motivation", video: "3z8enFKRnJc", cover: C5 },
    { n: 6, title: "Better Understanding through Asking Questions", video: "Niiul1U1KRs", cover: C6 },
    { n: 7, title: "Understanding Investment Parameters", video: "rzALDkyTo3I", cover: C7 },
    { n: 8, title: "Identifying the Decision-Making Process", video: "urODMGoPhys", cover: C8 },
    { n: 9, title: "Enhancing Customer Relationships", video: "FH6raB00_Xg", cover: C9 },
  ];

  const TOTAL = SESSIONS.length;
  const BRAND = "Lushin / Sandler Essentials";

  const grid    = document.getElementById("grid");
  const stage   = document.getElementById("stage");
  const eyebrow = document.getElementById("eyebrow");
  const title   = document.getElementById("title");
  const back    = document.getElementById("back");
  const prev    = document.getElementById("prev");
  const next    = document.getElementById("next");
  const homeView = document.getElementById("home");
  const sessView = document.getElementById("session");
  const logo    = document.getElementById("logo");

  SESSIONS.forEach(function (s) {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = "#session-" + s.n;
    a.innerHTML = '<img src="' + s.cover + '" alt="Session ' + s.n + ' of ' + TOTAL +
                  ' \u2014 ' + s.title + '" loading="lazy">';
    grid.appendChild(a);
  });

  let current = null;

  function showHome() {
    current = null;
    stage.innerHTML = "";
    sessView.classList.remove("on");
    homeView.classList.add("on");
    logo.classList.remove("corner");
    back.hidden = prev.hidden = next.hidden = true;
    document.title = BRAND;
  }

  function showSession(s) {
    current = s;
    eyebrow.textContent = "Session " + s.n + " of " + TOTAL;
    title.textContent = s.title;
    stage.innerHTML =
      '<iframe src="https://www.youtube-nocookie.com/embed/' + s.video + '?rel=0" ' +
      'title="' + s.title + '" allowfullscreen ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';

    homeView.classList.remove("on");
    sessView.classList.add("on");
    logo.classList.add("corner");
    back.hidden = false;

    const i = SESSIONS.indexOf(s);
    prev.hidden = i === 0;
    next.hidden = i === SESSIONS.length - 1;
    if (!prev.hidden) prev.href = "#session-" + SESSIONS[i - 1].n;
    if (!next.hidden) next.href = "#session-" + SESSIONS[i + 1].n;

    document.title = s.title + " \u2014 " + BRAND;
    window.scrollTo(0, 0);
  }

  function route() {
    const m = /^#session-(\d+)$/.exec(location.hash);
    const s = m && SESSIONS.filter(function (x) { return x.n === Number(m[1]); })[0];
    s ? showSession(s) : showHome();
  }

  document.addEventListener("keydown", function (e) {
    if (!current || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "Escape") location.hash = "";
    if (e.key === "ArrowRight" && !next.hidden) location.hash = next.getAttribute("href");
    if (e.key === "ArrowLeft"  && !prev.hidden) location.hash = prev.getAttribute("href");
  });

  window.addEventListener("hashchange", route);
  route();
})();
