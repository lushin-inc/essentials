    --ink-deep:   #030d20;
    --sea:        #0a2a63;
    --gold:       #fab040;
    --alert:      #e34554;
    --white:      #ffffff;
    --mist:       rgba(255,255,255,.46);

  }

  html, body { height: 100%; }

  }

  a { color: inherit; text-decoration: none; }

  :focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 4px; }

  .logo {
    position: fixed;
    top: var(--pad);
    left: var(--pad);
    width: 190px;
    z-index: 20;
  }
  .logo.corner { left: auto; right: var(--pad); width: 150px; opacity: .45; }

  /* ---------- fixed controls ---------- */

  .control {
    position: fixed;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--mist);
    transition: color .18s ease;
  }
  .control:hover { color: var(--white); }
  .control .arrow { color: var(--mist-soft); transition: color .18s ease, transform .18s ease; }
  .control:hover .arrow { color: var(--gold); }
  .control.back:hover .arrow, .control.prev:hover .arrow { transform: translateX(-4px); }
  .control.next:hover .arrow { transform: translateX(4px); }

  .control.back { top: calc(var(--pad) - 2px); left: var(--pad); }
  .control.prev { bottom: var(--pad); left: var(--pad); }
  .control.next { bottom: var(--pad); right: var(--pad); }
  .control[hidden] { display: none; }

  /* ---------- views ---------- */

  .view { display: none; }
  .view.on { display: block; animation: rise .26s ease both; }
  body.booting .view { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- password ---------- */

  #gate.on {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: var(--pad);
  }

  .gate-mark { width: 300px; margin-bottom: 48px; }

  .entry { display: flex; gap: 12px; }

  #pw {
    width: min(360px, 58vw);
    height: 58px;
    padding: 0 24px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.05);
    color: var(--white);
    font: 400 15px var(--font);
    outline: none;
    transition: border-color .2s ease;
  }
  #pw::placeholder { color: rgba(255,255,255,.32); }
  #pw:focus { border-color: rgba(255,255,255,.5); }
  #gate.bad #pw { border-color: var(--alert); animation: nudge .3s ease; }

  @keyframes nudge {
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  #go {
    height: 58px;
    padding: 0 30px;
    border: 0;
    border-radius: 999px;
    background: var(--white);
    color: var(--ink);
    font: 600 12px var(--font);
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s ease;
  }
  #go:disabled { opacity: .45; cursor: default; }

  .note {
    min-height: 20px;
    margin: 18px 0 0;
    font-size: 12.5px;
    letter-spacing: .03em;
    color: var(--mist);
  }

  /* ---------- home ---------- */

  #home.on {
    display: flex;
    align-items: center;
    min-height: 100svh;
    padding: calc(var(--pad) + 62px) var(--pad) var(--pad);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.6vw, 22px);
    width: 100%;
    max-width: 1240px;
    max-width: min(1240px, calc((100svh - 210px) * 16 / 9 + 44px));
    margin: 0 auto;
  }

  .tile {
    display: block;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: var(--sea);
    box-shadow: 0 10px 30px rgba(2, 10, 28, .45);
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .tile img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }
  .tile::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .28s ease;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 18px 42px rgba(15, 71, 161, .5);
  }
  .tile:hover::after, .tile:focus-visible::after { transform: scaleX(1); }

  /* ---------- session ---------- */

  #session.on {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 100svh;
    padding: calc(var(--pad) + 56px) var(--pad);
  }

  .wrap { width: min(1180px, 100%); margin: 0 auto; }

  .head { width: 100%; margin: 0 0 clamp(18px, 2.4vh, 30px); }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .title {
    margin: 0;
    font-size: clamp(21px, 2.7vw, 33px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.15;
  }

  .stage {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 22px 60px rgba(2, 10, 28, .55);
  }
  .stage iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* Keep the whole session on one screen: the video never grows past the
     height left over after the title and the Previous/Next row. */
  @media (min-width: 780px) {
    .wrap { width: min(1180px, 100%, calc((100vh - 340px) * 16 / 9)); }
    .wrap { width: min(1180px, 100%, calc((100svh - 340px) * 16 / 9)); }
  }

  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 620px) {
    #session.on { justify-content: flex-start; padding-top: calc(var(--pad) + 52px); }
    .grid { grid-template-columns: 1fr; }
    .logo { width: 148px; }
    .logo.corner { width: 118px; }
    .control { font-size: 10.5px; letter-spacing: .12em; }
    .entry { flex-direction: column; align-items: stretch; width: min(320px, 78vw); }
    #pw { width: 100%; }

    iters: 200000
  };

  const STORE = "essentials.key";
  const BRAND = "Lushin / Sandler Essentials";

  const $ = function (id) { return document.getElementById(id); };
  const gate = $("gate"), pw = $("pw"), go = $("go"), note = $("note"), entry = $("entry");
  const grid = $("grid"), stage = $("stage"), eyebrow = $("eyebrow"), title = $("title");
  const back = $("back"), prev = $("prev"), next = $("next"), logo = $("logo");
  const homeView = $("home"), sessView = $("session");

  function bytes(b64s) {
    const bin = atob(b64s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function remember(v) { try { localStorage.setItem(STORE, v); } catch (e) {} }
  function recall()    { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function forget()    { try { localStorage.removeItem(STORE); } catch (e) {} }

  async function open(password) {
    const base = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(VAULT.salt), iterations: VAULT.iters, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: bytes(VAULT.iv) }, key, bytes(VAULT.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  /* ---------- the hub, once unlocked ---------- */

  let SESSIONS = [], TOTAL = 0, current = null;

  function showHome() {
    current = null;
    stage.innerHTML = "";
    sessView.classList.remove("on");
    homeView.classList.add("on");
    logo.classList.remove("corner");
    back.hidden = prev.hidden = next.hidden = true;
    document.title = BRAND;
  }

  function showSession(s) {
    current = s;
    eyebrow.textContent = "Session " + s.n + " of " + TOTAL;
    title.textContent = s.title;
    stage.innerHTML =
      '<iframe src="https://www.youtube-nocookie.com/embed/' + s.video + '?rel=0" ' +
      'title="' + s.title + '" allowfullscreen ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>';

    homeView.classList.remove("on");
    sessView.classList.add("on");
    logo.classList.add("corner");
    back.hidden = false;

    const i = SESSIONS.indexOf(s);
    prev.hidden = i === 0;
    next.hidden = i === SESSIONS.length - 1;
    if (!prev.hidden) prev.href = "#session-" + SESSIONS[i - 1].n;
    if (!next.hidden) next.href = "#session-" + SESSIONS[i + 1].n;

    document.title = s.title + " \u2014 " + BRAND;
    window.scrollTo(0, 0);
  }

  function route() {
    if (location.hash === "#lock") { forget(); location.reload(); return; }
    const m = /^#session-(\d+)$/.exec(location.hash);
    const s = m && SESSIONS.filter(function (x) { return x.n === Number(m[1]); })[0];
    s ? showSession(s) : showHome();
  }

  function start(list) {
    SESSIONS = list;
    TOTAL = list.length;
    grid.innerHTML = "";
    list.forEach(function (s) {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = "#session-" + s.n;
      a.innerHTML = '<img src="' + s.cover + '" alt="Session ' + s.n + ' of ' + TOTAL +
                    ' \u2014 ' + s.title + '">';
      grid.appendChild(a);
    });

    gate.classList.remove("on");
    logo.hidden = false;
    document.body.classList.remove("booting");

    window.addEventListener("hashchange", route);
    route();

    document.addEventListener("keydown", function (e) {
      if (!current || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "Escape") location.hash = "";
      if (e.key === "ArrowRight" && !next.hidden) location.hash = next.getAttribute("href");
      if (e.key === "ArrowLeft"  && !prev.hidden) location.hash = prev.getAttribute("href");
    });
  }

  /* ---------- the gate ---------- */

  function askForPassword(message) {
    document.body.classList.remove("booting");
    gate.classList.add("on");
    note.textContent = message || "";
    pw.value = "";
    setTimeout(function () { pw.focus(); }, 60);
  }

  entry.addEventListener("submit", async function (e) {
    e.preventDefault();
    const value = pw.value.trim();
    if (!value) return;
    go.disabled = true;
    note.textContent = "Checking\u2026";
    gate.classList.remove("bad");
    try {
      const list = await open(value);
      remember(value);
      start(list);
    } catch (err) {
      gate.classList.add("bad");
      note.textContent = "That password didn't work.";
      go.disabled = false;
      pw.select();
    }
  });

  (async function boot() {
    if (!window.crypto || !crypto.subtle) {
      askForPassword("Open this page over https to unlock it.");
      go.disabled = true;
      return;
    }
    /* #lock signs you back out — handy for testing the gate. */
    if (location.hash === "#lock") {
      forget();
      history.replaceState(null, "", location.pathname + location.search);
      askForPassword("");
      return;
    }
    const saved = recall();
    if (!saved) return askForPassword("");
    try {
      start(await open(saved));
    } catch (err) {
      forget();
      askForPassword("");
    }
  })();
})();
